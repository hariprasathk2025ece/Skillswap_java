# =============================================
# SkillSwap - Application Properties
# =============================================

spring.application.name=Skillswap

# --- Database Configuration ---
# IMPORTANT: Replace YOUR_MYSQL_PASSWORD with your actual MySQL password
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap
spring.datasource.username=root
spring.datasource.password=edengarden

# --- JPA / Hibernate ---
# 'update' will auto-create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
